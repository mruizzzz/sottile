<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOTTILE · Carta digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--ink:#1c1a17;--mute:#6f675d;--line:#d9d1c3;--accent:#5b6232;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--ink:#efe9dd;--mute:#a69d8f;--line:#38332c;--accent:#a9b26a}}
:root[data-theme="dark"]{--bg:#171512;--ink:#efe9dd;--mute:#a69d8f;--line:#38332c;--accent:#a9b26a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.65 var(--sans)}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
header{text-align:center;padding:64px 0 40px}
header h1{font:400 clamp(48px,10vw,84px)/1 var(--serif);letter-spacing:.32em;margin:0 0 0 .32em}
.tag{font:italic 400 22px var(--serif);color:var(--accent);margin:14px 0 18px}
.intro{max-width:540px;margin:0 auto;color:var(--mute)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[role=tablist]{display:flex;justify-content:center;gap:clamp(4px,4vw,44px)}
[role=tab]{background:none;border:0;border-bottom:1px solid transparent;color:var(--mute);font:400 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:18px 8px;cursor:pointer;transition:color .25s,border-color .25s;margin-bottom:-1px}
[role=tab]:hover{color:var(--ink)}
[role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
[role=tab]:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
main{padding:56px 0 24px}
.panel{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.lead{text-align:center;max-width:560px;margin:0 auto 48px;color:var(--mute)}
.price-big{display:block;font:400 56px/1 var(--serif);margin:0 0 6px}
.price-big small{font:300 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-left:8px}
h2{font:400 30px var(--serif);margin:56px 0 8px;display:flex;align-items:center;gap:18px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
h2 i{font:italic 400 17px var(--serif);color:var(--accent)}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:0 14px;padding:22px 0;border-bottom:1px solid var(--line)}
.item.nonum{grid-template-columns:1fr auto}
.n{font:italic 400 24px var(--serif);color:var(--accent);line-height:1.2}
.item h3{font:500 22px/1.2 var(--serif);margin:0}
.item p{margin:6px 0 0;color:var(--mute);font-size:15px}
.ing{font-size:12px!important;letter-spacing:.08em;text-transform:uppercase}
.pr{font:400 20px var(--serif);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.sup{font-size:13px;color:var(--accent);display:block;font-family:var(--sans)}
.al{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0 0}
.al img{display:block;border-radius:50%}
.opt{font:italic 400 17px var(--serif);color:var(--accent);margin:34px 0 0;text-align:center}
.total{text-align:center;margin:48px 0 0}
.note{border-top:1px solid var(--line);margin-top:72px;padding:48px 0;text-align:center}
.note h2{justify-content:center;margin-top:0}.note h2::after{display:none}
.note p{max-width:560px;margin:0 auto 14px;color:var(--mute)}
.small{font-size:13px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.wine{margin:0 0 0 58px;padding:18px 0 18px 18px;border-left:1px solid var(--accent)}
.wine span{display:block}
.wl{font:400 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.wn{font:italic 400 21px/1.3 var(--serif);margin-top:4px}
.wd{font-size:12px;letter-spacing:.06em;color:var(--mute)}
.wine p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px;text-align:left}
.choice button{background:none;border:1px solid var(--line);color:var(--ink);padding:14px 18px;cursor:pointer;font:inherit;transition:border-color .25s}
.choice button:hover{border-color:var(--mute)}
.choice button[aria-pressed=true]{border-color:var(--accent)}
.choice button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice span{display:block;font:400 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.choice strong{font:400 24px var(--serif)}
.sub-p{color:var(--accent);font:italic 400 17px var(--serif);margin:8px 0 0}
.rows{margin:32px 0 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.row span{font:500 20px var(--serif)}
.row b{font:400 22px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.tot b{color:var(--accent)}
.wlist{margin:28px 0 0;padding:0;list-style:none;font-size:14px;color:var(--mute)}
.wlist li{display:flex;gap:16px;padding:6px 0}
.wlist i{flex:0 0 84px;font-style:normal;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.wlist em{font:italic 400 17px var(--serif);color:var(--ink)}
@media (max-width:560px){.choice{grid-template-columns:1fr}.wine{margin-left:46px}.wlist i{flex-basis:64px}}
@media (max-width:560px){.wrap{padding:0 20px}.item{grid-template-columns:32px 1fr auto}[role=tab]{font-size:11px;letter-spacing:.1em}}
</style>
</head>

/* ===== COMPONENTES ===== */
function Allergens({name}){
  const c=ALERG[name];if(!c||!c.length)return null;
  return h("ul",{className:"al","aria-label":"Alérgenos: "+c.map(k=>ANAMES[k]).join(", ")},
    c.map(k=>h("li",{key:k},h("img",{src:ICONS[k],alt:ANAMES[k],title:ANAMES[k],width:26,height:26}))));
}
const h=React.createElement,{useState,useRef}=React;
function Dish({n,d,price,extra,ing}){
  return h("div",{className:"item"+(n?"":" nonum")},
    n?h("div",{className:"n","aria-hidden":"true"},String(n).padStart(2,"0")):null,
    h("div",null,h("h3",null,d[0]),h("p",null,d[1]),ing?h("p",{className:"ing"},ing):null,h(Allergens,{name:d[0]})),
    h("div",{className:"pr"},price?price+" €":null,extra?h("span",{className:"sup"},extra):null));
}
function Section({title,sub,children}){
  return h("section",null,h("h2",null,title,sub?h("i",null,sub):null),children);
}
function Wine({w}){
  return h("aside",{className:"wine"},
    h("span",{className:"wl"},"Maridaje · pases "+pad(w.from)+"–"+pad(w.to)),
    h("span",{className:"wn"},w.name),h("span",{className:"wd"},w.doc),h("p",null,w.note));
}
function Degustacion({data,mode,setMode}){
  let n=0;const M=MARIDAJE,con=mode==="con",total=M.base+M.supplement;
  const opt=(id,label,price)=>h("button",{type:"button","aria-pressed":mode===id,onClick:()=>setMode(id)},h("span",null,label),h("strong",null,eur(price)));
  return h("div",null,
    h("div",{className:"lead"},
      h("span",{className:"price-big"},eur(con?total:M.base),h("small",null,data.unit)),
      con?h("p",{className:"sub-p"},"Menú "+eur(M.base)+" + maridaje "+eur(M.supplement)):null,
      h("p",null,data.intro),
      h("div",{className:"choice",role:"group","aria-label":"Elegir opción"},opt("solo",M.labelSolo,M.base),opt("con",M.labelCon,total))),
    data.blocks.map(b=>h(Section,{key:b.title,title:b.title,sub:b.sub},
      b.dishes.map(d=>{n++;const w=WINES.find(x=>x.from===n);
        return h(React.Fragment,{key:d[0]},w&&con?h(Wine,{w}):null,h(Dish,{n,d:[d[0],d[1]],ing:d[2]}));}))),
    con?h("section",{className:"pairing"},
      h("h2",null,M.title),h("p",{className:"lead",style:{margin:"16px auto 0"}},M.text)):null);
}
function Carta({data}){
  return h("div",null,data.map(c=>h(Section,{key:c.title,title:c.title},
    c.dishes.map(d=>h(Dish,{key:d[0],d,price:d[2]})))));
}

    h("div",{className:"lead"},h("span",{className:"price-big"},data.price,h("small",null,data.unit)),h("p",null,data.intro)),
    data.steps.map(s=>h(Section,{key:s.title,title:s.title,sub:s.sub},
      s.dishes.map(d=>h(Dish,{key:d[0],d,extra:d[2]})))),
    h("p",{className:"opt"},"Los platos sin indicación están incluidos en el precio del menú."));
}
const VIEWS={degustacion:s=>h(Degustacion,{data:DEGUSTACION,...s}),carta:()=>h(Carta,{data:CARTA}),italiano:()=>h(Italiano,{data:ITALIANO})};
function Tabs({active,onChange}){
  const refs=useRef([]);
  const onKey=(e,i)=>{
    let j=null;
    if(e.key==="ArrowRight")j=(i+1)%TABS.length;
    if(e.key==="ArrowLeft")j=(i+TABS.length-1)%TABS.length;
    if(j!==null){e.preventDefault();onChange(TABS[j].id);refs.current[j].focus();}
  };
  return h("nav",null,h("div",{className:"wrap"},h("div",{role:"tablist","aria-label":"Menús"},
    TABS.map((t,i)=>h("button",{key:t.id,ref:el=>refs.current[i]=el,role:"tab",id:"tab-"+t.id,
      "aria-selected":active===t.id,"aria-controls":"panel",tabIndex:active===t.id?0:-1,
      onClick:()=>onChange(t.id),onKeyDown:e=>onKey(e,i)},t.label)))));
}
function App(){
  const [active,setActive]=useState("degustacion");
  const [mode,setMode]=useState("solo");
  const change=id=>{setActive(id);try{history.replaceState(null,"","#"+id)}catch(e){}};
  return h(React.Fragment,null,
    h("header",null,h("div",{className:"wrap"},h("h1",null,SITE.name),h("p",{className:"tag"},SITE.tagline),h("p",{className:"intro"},SITE.intro))),
    h(Tabs,{active,onChange:change}),
    h("main",null,h("div",{className:"wrap"},
      h("div",{className:"panel",key:active,id:"panel",role:"tabpanel","aria-labelledby":"tab-"+active,tabIndex:0},VIEWS[active]({mode,setMode})),
      h("div",{className:"note"},h("h2",null,"Nuestra cocina"),h("p",null,SITE.philosophy),h("p",{className:"small"},SITE.seasonal),h("p",{className:"small"},SITE.allergens)))),
    h("footer",null,h("div",{className:"wrap"},SITE.name)));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
